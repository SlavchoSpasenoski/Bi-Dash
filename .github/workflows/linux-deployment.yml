name: Linux deployment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - compose.linux.yaml
      - scripts/linux.sh
      - bin/**
      - .gitattributes
      - .github/workflows/linux-deployment.yml
permissions:
  contents: read
jobs:
  fresh-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/linux.sh
      - name: Install and check readiness
        run: |
          bash scripts/linux.sh install
          curl --fail --retry 30 --retry-delay 5 --retry-all-errors http://localhost:5001/ping
          sha256sum .env.linux > /tmp/bidash-env.sha256
          bash scripts/linux.sh install
          sha256sum --check /tmp/bidash-env.sha256
          bash scripts/linux.sh stop
          bash scripts/linux.sh start
          curl --fail --retry 30 --retry-delay 5 --retry-all-errors http://localhost:5001/ping
          sha256sum --check /tmp/bidash-env.sha256
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file .env.linux -f compose.linux.yaml logs --tail 100
      - name: Clean up
        if: always()
        run: docker compose --env-file .env.linux -f compose.linux.yaml down -v
